services:
  asterisk:
    build: .
    image: vowin/asterisk:local
    container_name: vowin-asterisk
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config:/etc/asterisk:ro
      - asterisk-lib:/var/lib/asterisk
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
    tmpfs:
      - /run/asterisk:uid=10001,gid=10001,mode=0750
      - /tmp:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: [CMD-SHELL, "/usr/sbin/asterisk -rx 'module show like chan_pjsip.so' | grep -q Running"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  asterisk-lib:
  asterisk-spool:
  asterisk-log:
